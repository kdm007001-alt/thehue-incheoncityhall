name: Temporary image optimization
on:
  push:
    branches: [image-opt-20261001-0323]
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image libraries
        run: python -m pip install Pillow==11.3.0 numpy==2.2.6
      - name: Optimize images without changing dimensions
        env:
          IMAGE_REPORT_PATH: ${{ runner.temp }}/image-report.json
          IMAGE_LOCAL_DOMAINS: apt-dm.co.kr,apt1.co.kr
        run: |
          cat > "${RUNNER_TEMP}/image-opt.py" <<'PY'
          import os,sys,json,re,io,hashlib,collections,urllib.parse
          from pathlib import Path
          from PIL import Image,ImageOps
          import numpy as np
          
          root=Path(sys.argv[1]).resolve()
          Image.MAX_IMAGE_PIXELS=100_000_000
          skip_dirs={'.git','node_modules','.next','.sites-runtime','__pycache__'}
          files=[p for p in root.rglob('*') if p.is_file() and not any(s in skip_dirs for s in p.relative_to(root).parts)]
          imgs=[p for p in files if p.suffix.lower() in {'.png','.jpg','.jpeg','.webp'} and p.stat().st_size>=30000 and p.name!='screenshot.jpeg']
          groups=collections.defaultdict(list)
          for p in imgs: groups[hashlib.sha256(p.read_bytes()).hexdigest()].append(p)
          report={'scanned':len(imgs),'unique':len(groups),'changed':[],'converted':[],'reference_files':[],'errors':[],'before_bytes':sum(p.stat().st_size for p in imgs)}
          converts={}; cached={}
          
          def save_bytes(im,fmt,**kw):
           b=io.BytesIO(); im.save(b,format=fmt,**kw); return b.getvalue()
          def similarity(a,b):
           a=a.convert('RGB');b=b.convert('RGB'); a.thumbnail((1024,1024));b.thumbnail((1024,1024))
           x=np.asarray(a,dtype=np.float64);y=np.asarray(b,dtype=np.float64)
           mx=x.mean(axis=(0,1));my=y.mean(axis=(0,1));vx=x.var(axis=(0,1));vy=y.var(axis=(0,1));cv=((x-mx)*(y-my)).mean(axis=(0,1))
           score=((2*mx*my+6.5025)*(2*cv+58.5225))/((mx*mx+my*my+6.5025)*(vx+vy+58.5225))
           return float(score.min()),float(np.abs(x-y).mean())
          
          for digest,paths in groups.items():
           p=paths[0]; old=p.read_bytes()
           try:
            with Image.open(io.BytesIO(old)) as src:
             if getattr(src,'n_frames',1)>1: continue
             im=src.copy();fmt=src.format;info=src.info; size=src.size;original_size=size
             if fmt not in {'PNG','JPEG','WEBP'}: continue
             icc=info.get('icc_profile');exif=info.get('exif');common={}
             if icc:common['icc_profile']=icc
             if exif:common['exif']=exif
             best=old
             photographic=re.search(r'(hero|point-|main|thumb|card-|premium|vision|perspective|aerial|example)',p.name,re.I) and not re.search(r'(map|plan|unit|type|location|layout|floor)',p.name,re.I)
             cap=960 if re.search(r'(thumb|card-)',p.name,re.I) else (1280 if re.search(r'point-',p.name,re.I) else 1920)
             resized=bool(fmt in {'JPEG','WEBP'} and photographic and im.width>cap)
             if resized:
              im=im.resize((cap,max(1,round(im.height*cap/im.width))),Image.Resampling.LANCZOS);size=im.size
             if fmt=='PNG':
              candidate=save_bytes(im,'PNG',optimize=True,compress_level=9,**common)
              if len(candidate)<len(best):best=candidate
              rgba=im.convert('RGBA')
              web=save_bytes(rgba,'WEBP',lossless=True,method=6,exact=True,**common)
              decoded=Image.open(io.BytesIO(web)).convert('RGBA')
              if np.array_equal(np.asarray(rgba),np.asarray(decoded)) and len(web)<=len(old)*.85 and len(old)-len(web)>=12000:
               for q in paths:
                target=q.with_suffix('.webp')
                if not target.exists():converts[q]=web
             else:
              for quality in [90,94,97]:
               if fmt=='JPEG':
                candidate=save_bytes(im,'JPEG',quality=quality,optimize=True,progressive=True,subsampling=0,**common)
               else:
                candidate=save_bytes(im,'WEBP',quality=quality,method=6,**common)
               if len(candidate)>=len(old)*.9 or len(old)-len(candidate)<12000:continue
               dec=Image.open(io.BytesIO(candidate));score,mae=similarity(im.copy(),dec.copy())
               alpha_ok=im.mode!='RGBA' or np.array_equal(np.asarray(im.getchannel('A')),np.asarray(dec.convert('RGBA').getchannel('A')))
               if dec.size==size and score>=.997 and mae<=1.5 and alpha_ok:
                best=candidate;break
             if len(best)<len(old)*.98 and len(old)-len(best)>=4096:
              for q in paths:
               q.write_bytes(best)
               report['changed'].append({'path':str(q.relative_to(root)),'before':len(old),'after':len(best),'width':size[0],'height':size[1],'original_width':original_size[0],'original_height':original_size[1],'format':fmt})
           except Exception as e:report['errors'].append({'path':str(p.relative_to(root)),'reason':str(e)[:200]})
          
          # Convert only basename groups whose every occurrence can use the new asset.
          # Original PNGs remain available for generated or external references.
          by_name=collections.defaultdict(list)
          for p in files:
           if p.suffix.lower()=='.png':by_name[p.name].append(p)
          names={}
          for name,paths in by_name.items():
           if paths and all(p in converts for p in paths):
            for p in paths:
             target=p.with_suffix('.webp');data=converts[p];target.write_bytes(data)
             report['converted'].append({'path':str(p.relative_to(root)),'webp':str(target.relative_to(root)),'before':p.stat().st_size,'after':len(data),'lossless':True})
            names[name]=Path(name).with_suffix('.webp').name
            names[urllib.parse.quote(name)]=urllib.parse.quote(Path(name).with_suffix('.webp').name)
          allowed_domains=set(os.environ.get('IMAGE_LOCAL_DOMAINS','apt-dm.co.kr').split(','))
          if names:
           pat=re.compile(r'(?P<token>[^\s\"\'<>`(){}\[\],;\\=]*?(?P<name>'+ '|'.join(re.escape(n) for n in sorted(names,key=len,reverse=True))+r'))(?![\w.\-])')
           def replacement(m):
            token=m['token'];name=m['name']
            if token.startswith(('http://','https://','//')):
             parsed=urllib.parse.urlsplit(token if not token.startswith('//') else 'https:'+token)
             if parsed.hostname not in allowed_domains:return token
            return token[:-len(name)]+names[name]
           for p in files:
            if p.suffix.lower() not in {'.astro','.html','.htm','.js','.mjs','.cjs','.ts','.tsx','.jsx','.json','.css','.scss','.xml','.py'}:continue
            if p.name in {'optimize_images.py','image-opt-20261001.yml'}:continue
            try:
             original=p.read_text('utf-8'); changed=pat.sub(replacement,original)
             if changed!=original:
              p.write_text(changed,'utf-8');report['reference_files'].append(str(p.relative_to(root)))
            except UnicodeError:pass
          report['after_bytes']=sum(p.stat().st_size for p in imgs)
          report['same_format_saved_bytes']=report['before_bytes']-report['after_bytes']
          report['converted_request_saved_bytes']=sum(x['before']-x['after'] for x in report['converted'])
          report['verified']='photo dimensions limited to display needs with aspect ratio retained; maps and plans not resized; PNG to WebP pixel-identical; lossy SSIM >= 0.997 and MAE <= 1.5; alpha retained'
          dest=os.environ.get('IMAGE_REPORT_PATH')
          if dest:Path(dest).write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps({k:v for k,v in report.items() if k not in {'changed','converted','errors','reference_files'}},ensure_ascii=False))
          print(json.dumps({'changed_count':len(report['changed']),'converted_count':len(report['converted']),'reference_files':len(report['reference_files']),'errors':report['errors']},ensure_ascii=False))
          
          PY
          python "${RUNNER_TEMP}/image-opt.py" .
      - name: Store optimized image tree
        run: |
          rm .github/workflows/image-opt-20261001.yml
          git add --all
          git -c user.name='Image optimization' -c user.email='images@users.noreply.github.com' commit -m 'Optimize images; preserve layout and customer functions' || true
          git push origin HEAD:refs/heads/image-opt-result-20261001-0323
          python - <<'PY'
          import subprocess,json,os
          d=json.load(open(os.environ['RUNNER_TEMP']+'/image-report.json'))
          d.update(commit_sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),tree_sha=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip())
          print('IMAGE_OPT_RESULT '+json.dumps(d,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: image-optimization-report
          path: ${{ runner.temp }}/image-report.json
