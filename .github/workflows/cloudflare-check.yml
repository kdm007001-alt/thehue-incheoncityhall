name: Check Cloudflare deployment credentials
on:
  push:
    paths:
      - .github/workflows/cloudflare-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check token availability
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "Cloudflare credentials are available in this repository."
          else
            echo "Cloudflare credentials are not available in this repository."
            exit 2
          fi
